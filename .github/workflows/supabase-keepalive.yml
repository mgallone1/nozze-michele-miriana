name: Supabase Keep-Alive

on:
  schedule:
    # Esegue il ping ogni 3 giorni alle 08:00 UTC (così non supera mai i 7 giorni di inattività)
    - cron: '0 8 */3 * *'
  workflow_dispatch: # Permette di avviarlo manualmente dalla scheda Actions di GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database Vault
        run: |
          curl --fail -s -X GET \
            "https://rpccqbydibkmkpmrlxgv.supabase.co/rest/v1/wedding_vault?id=eq.matrimonio_mm_vault_master&select=id" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null -w "HTTP Status: %{http_code}\n"
